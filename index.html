<script>
const STOCKS=[

];

const DB={};
let curView='summary',curSym=STOCKS[0].sym,calcSym=STOCKS[0].sym;
function rnd(n,d=2){return n==null?null:+n.toFixed(d);}

// 多代理，最穩定的優先
// 你的專屬 Cloudflare Worker（穩定、免費、無 CORS 問題）
const WORKER_URL="https://gentle-mountain-7c00.wugawee.workers.dev";

function parseChart(json){
  const R=json.chart.result[0];const q=R.indicators.quote[0];
  const meta=R.meta||{};
  const isLive=meta.marketState&&['PRE','REGULAR','POST'].includes(meta.marketState);
  const ts_arr=R.timestamp||[];
  const lastIdx=ts_arr.length-1;
  const data=[];
  for(let i=0;i<ts_arr.length;i++){
    const ts=ts_arr[i];
    let close=q.close[i];
    let open=q.open[i], hi=q.high[i], lo=q.low[i];
    // 最後一筆若收盤為null（盤中或盤後未回填），直接用即時價補上
    if(i===lastIdx && close==null && meta.regularMarketPrice!=null){
      close=meta.regularMarketPrice;
      if(open==null)open=meta.regularMarketOpen??meta.regularMarketPrice;
      if(hi==null)hi=meta.regularMarketDayHigh??close;
      if(lo==null)lo=meta.regularMarketDayLow??close;
    }
    // 收盤null但當天有其他價格 → 用高低中值/開盤/前一日收盤補，避免整根消失（如00403A等主動式ETF偶爾缺值）
    if(close==null){
      if(hi!=null&&lo!=null)close=(hi+lo)/2;
      else if(open!=null)close=open;
      else if(data.length)close=data[data.length-1].c;
    }
    if(close==null)continue; // 真的完全無資料才跳過
    open=open??close; hi=hi??close; lo=lo??close;
    const _off=(meta.gmtoffset??meta.gmtOffset??28800);
    const d=new Date((ts+_off)*1000);
    const mo=(d.getUTCMonth()+1).toString().padStart(2,'0');
    const dy=d.getUTCDate().toString().padStart(2,'0');
    data.push({date:`${mo}/${dy}`,o:rnd(open),h:rnd(hi),l:rnd(lo),c:rnd(close),vol:q.volume[i]||0,ts:ts});
  }
  // 若 meta 的即時時間比最後一筆還新（代表盤中當天K棒根本沒進timestamp），補一筆
  if(meta.regularMarketPrice!=null && meta.regularMarketTime!=null){
    const _off2=(meta.gmtoffset??meta.gmtOffset??28800);
    const lastTs=data.length?data[data.length-1].ts:0;
    const mt=meta.regularMarketTime;
    const lastDay=new Date((lastTs+_off2)*1000).toISOString().slice(0,10);
    const mtDay=new Date((mt+_off2)*1000).toISOString().slice(0,10);
    if(mtDay!==lastDay){
      // 當天還沒有K棒，且盤中才補（收盤/未開盤不補，避免幽靈K棒）
      const d=new Date((mt+_off2)*1000);
      const mo=(d.getUTCMonth()+1).toString().padStart(2,'0');
      const dy=d.getUTCDate().toString().padStart(2,'0');
      data.push({date:`${mo}/${dy}`,
        o:rnd(meta.regularMarketOpen??meta.regularMarketPrice),
        h:rnd(meta.regularMarketDayHigh??meta.regularMarketPrice),
        l:rnd(meta.regularMarketDayLow??meta.regularMarketPrice),
        c:rnd(meta.regularMarketPrice),
        vol:meta.regularMarketVolume||0,ts:mt});
    }
  }
  // 濾掉補洞產生的假K棒（量0且開高低收四價完全相同，多為ETF前一日資料延遲），保留最後一根
  for(let _k=data.length-2;_k>=0;_k--){
    const _d=data[_k];
    if(_d.vol===0 && _d.o===_d.h && _d.h===_d.l && _d.l===_d.c) data.splice(_k,1);
  }
  if(data.length>0){
    data._marketState=meta.marketState||'CLOSED';
    data._isLive=isLive;
  }
  return data;
}
async function fetchStock(sym,tries=0){
  const cacheBuster=Date.now();
  const url=`${WORKER_URL}/?symbol=${encodeURIComponent(sym)}&_t=${cacheBuster}`;
  try{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),12000);
    const res=await fetch(url,{signal:ctrl.signal,cache:'no-store'});
    clearTimeout(timer);
    const json=await res.json();
    const data=parseChart(json);
    if(data.length>=1)return data;
  }catch(e){}
  // 失敗重試（最多3次）
  if(tries<3){await new Promise(r=>setTimeout(r,1200));return fetchStock(sym,tries+1);}
  return [];
}

function ma(arr,p){return arr.map((_,i)=>i<p-1?null:rnd(arr.slice(i-p+1,i+1).reduce((a,b)=>a+b,0)/p));}
function calcKD(data,p=9){let K=50,D=50;return data.map((d,i)=>{const sl=data.slice(Math.max(0,i-p+1),i+1);const hi=Math.max(...sl.map(x=>x.h)),lo=Math.min(...sl.map(x=>x.l));const rsv=hi===lo?50:((d.c-lo)/(hi-lo))*100;K=(2/3)*K+(1/3)*rsv;D=(2/3)*D+(1/3)*K;return{K:rnd(K),D:rnd(D)};});}
function calcMACD(closes){const ema=(arr,pp)=>{const k=2/(pp+1);let e=arr[0];return arr.map((v,i)=>{if(i===0)return e;e=v*k+e*(1-k);return rnd(e,4);});};const ef=ema(closes,12),es=ema(closes,26);const dif=closes.map((_,i)=>rnd(ef[i]-es[i],4));const esig=ema(dif,9);return{dif,hist:dif.map((v,i)=>rnd(v-esig[i],4))};}

// 偵測所有看漲入場型態
function detectPatterns(data){
  const pats=[];
  for(let i=2;i<data.length;i++){
    const d=data[i],body=Math.abs(d.c-d.o),lower=Math.min(d.c,d.o)-d.l,upper=d.h-Math.max(d.c,d.o),range=d.h-d.l;
    const p1=data[i-1],p2=data[i-2];
    const isRed=d.c>d.o, isGreen=d.c<d.o; // 台股:紅漲綠跌
    const p1Red=p1.c>p1.o, p1Green=p1.c<p1.o;
    const p2Red=p2.c>p2.o, p2Green=p2.c<p2.o;
    // ============ 看漲/止跌訊號（紅/藍標記）============
    // 錘子線（下影長，止跌）
    if(lower>body*1.8&&upper<body*0.5&&range>0)pats.push({i,type:'🔨錘子線(止跌)',color:'#26a641',short:'錘',bull:true});
    // 倒錘線
    if(upper>body*1.8&&lower<body*0.5&&range>0&&isRed)pats.push({i,type:'倒錘線(止跌)',color:'#26a641',short:'倒',bull:true});
    // 蜻蜓十字（強力止跌）
    if(body<range*0.1&&lower>range*0.6&&range>0)pats.push({i,type:'蜻蜓十字(強止跌)',color:'#26a641',short:'蜻',bull:true});
    // 看漲吞噬（紅K吃掉前綠K）
    if(isRed&&p1Green&&d.c>p1.o&&d.o<p1.c)pats.push({i,type:'🔴看漲吞噬',color:'#58a6ff',short:'吞',bull:true});
    // 貫穿線
    if(p1Green&&isRed&&d.o<p1.c&&d.c>(p1.o+p1.c)/2&&d.c<p1.o)pats.push({i,type:'貫穿線(看漲)',color:'#58a6ff',short:'貫',bull:true});
    // 早晨之星（晨星：長綠→小實體→長紅）
    if(p2Green&&Math.abs(p1.c-p1.o)<Math.abs(p2.c-p2.o)*0.35&&isRed&&d.c>(p2.o+p2.c)/2)pats.push({i,type:'⭐晨星(看漲)',color:'#bc8cff',short:'晨',bull:true});
    // 多頭孕線
    if(p1Green&&isRed&&d.o>p1.c&&d.c<p1.o)pats.push({i,type:'多頭孕線',color:'#26a641',short:'孕',bull:true});
    // 三白兵（連3紅，下跌轉上漲）
    if(isRed&&p1Red&&p2Red&&d.c>p1.c&&p1.c>p2.c)pats.push({i,type:'⚔️三白兵(強看漲)',color:'#f85149',short:'兵',bull:true});
    // 錘子底（兩根K同最低）
    if(Math.abs(d.l-p1.l)<range*0.05&&range>0&&lower>body)pats.push({i,type:'錘子底(看漲)',color:'#26a641',short:'底',bull:true});
    // ============ 看跌/止漲警示（綠色⚠️標記）============
    // 黃昏星（長紅→小實體→長綠，上漲末端）
    if(p2Red&&Math.abs(p1.c-p1.o)<Math.abs(p2.c-p2.o)*0.35&&isGreen&&d.c<(p2.o+p2.c)/2)pats.push({i,type:'⚠️黃昏星(看跌)',color:'#26a641',short:'昏',bull:false});
    // 三烏鴉（連3綠，上漲轉下跌）
    if(isGreen&&p1Green&&p2Green&&d.c<p1.c&&p1.c<p2.c)pats.push({i,type:'⚠️三烏鴉(強看跌)',color:'#26a641',short:'鴉',bull:false});
    // 看跌吞噬（綠K吃掉前紅K）
    if(isGreen&&p1Red&&d.o>p1.c&&d.c<p1.o)pats.push({i,type:'⚠️看跌吞噬',color:'#26a641',short:'空吞',bull:false});
    // 烏雲蓋頂（綠K開高於前高、收在前紅K中點下）
    if(p1Red&&isGreen&&d.o>p1.c&&d.c<(p1.o+p1.c)/2&&d.c>p1.o)pats.push({i,type:'⚠️烏雲蓋頂(看跌)',color:'#26a641',short:'雲',bull:false});
    // 鎚子頂（兩根K同最高，看跌）
    if(Math.abs(d.h-p1.h)<range*0.05&&range>0&&upper>body)pats.push({i,type:'⚠️鎚子頂(看跌)',color:'#26a641',short:'頂',bull:false});
    // 十字線（變盤，中性）
    if(body<range*0.08&&range>0)pats.push({i,type:'✛十字線(變盤)',color:'#e3b341',short:'十',bull:null});
  }
  return pats;
}

function processStock(sym,data){
  if(!data||data.length<1){
    // 抓取失敗：若已有舊資料就保留，不要清空（避免代理失敗導致資料消失）
    if(!DB[sym])DB[sym]=null;
    return;
  }
  // 防退化：若新資料的最新日期比現有的舊（代理回傳快取），保留現有較新的資料
  if(DB[sym]&&DB[sym].data&&DB[sym].data.length>0){
    const oldTs=DB[sym].data[DB[sym].data.length-1].ts||0;
    const newTs=data[data.length-1].ts||0;
    if(newTs<oldTs)return; // 新抓的更舊，不覆蓋
  }
  const closes=data.map(d=>d.c);
  DB[sym]={data,closes,ma5:ma(closes,5),ma10:ma(closes,10),ma20:ma(closes,20),ma60:ma(closes,60),kd:calcKD(data),macd:calcMACD(closes),pats:detectPatterns(data),last:data[data.length-1],prev:(data.length>=2?data[data.length-2]:data[data.length-1])};
}

// 分批並行（每批5支，避免代理塞車）
async function loadAll(){
  document.getElementById('mainView').innerHTML='<div class="loading">🔄 載入即時股價中...</div>';
  let done=0;
  const BATCH=5;
  for(let i=0;i<STOCKS.length;i+=BATCH){
    const batch=STOCKS.slice(i,i+BATCH);
    await Promise.all(batch.map(async s=>{
      const data=await fetchStock(s.sym);
      processStock(s.sym,data);
      done++;
      document.getElementById('prog').textContent=`載入中... ${done}/${STOCKS.length}`;
    }));
  }
  document.getElementById('prog').textContent='';
  render();
  // 自動更新：每60秒重抓一次（盤中即時跟動）
  if(window._autoTimer)clearInterval(window._autoTimer);
  window._autoTimer=setInterval(()=>{loadAll();},60000);
}

function setView(v,el){curView=v;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));if(el)el.classList.add('on');render();}
function selectSym(sym,v){curSym=sym;curView=v||'tw';render();}

function render(){
  if(curView==='summary')renderSummary();
  else if(curView==='tw')renderList('TW');
  else if(curView==='us')renderList('US');
  else if(curView==='calc')renderCalcPage();
  else if(curView==='inst')renderInst();
  else renderChart(curSym);
}

// ── 總覽（首頁）──
function sumRow(s){
  const db=DB[s.sym];
  if(!db)return`<tr><td class="nm">${s.name}</td><td>${s.sym}</td><td colspan="9" style="color:#f85149">無資料</td></tr>`;
  const last=db.last,prev=db.prev,chg=rnd(last.c-prev.c),chgP=rnd(chg/prev.c*100);
  const kL=db.kd[db.kd.length-1],kP=db.kd[db.kd.length-2];

  }).join('');

      <th>日期</th><th>開盤</th><th>最高</th><th>最低</th><th>收盤</th><th>K棒型態</th><th>操作訊號(MA20)</th><th>成交量(張)</th>

function drawKD(id,kd){const c=document.getElementById(id);if(!c)return;const W=c.offsetWidth||640,H=90;c.width=W;c.height=H;const ctx=c.getContext('2d');const n=kd.length,P={t:8,b:8,l:8,r:50},cw=W-P.l-P.r,ch=H-P.t-P.b;const xS=i=>P.l+i*(cw/(n-1||1)),yS=v=>(1-v/100)*ch+P.t;ctx.strokeStyle='#21262d';ctx.lineWidth=0.5;[0,20,50,80,100].forEach(v=>{ctx.beginPath();ctx.moveTo(P.l,yS(v));ctx.lineTo(W-P.r,yS(v));ctx.stroke();ctx.fillStyle='#8b949e';ctx.font='9px Arial';ctx.textAlign='left';ctx.fillText(v,W-P.r+4,yS(v)+3);});[[kd.map(k=>k.K),'#58a6ff'],[kd.map(k=>k.D),'#f85149']].forEach(([arr,col])=>{ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.beginPath();arr.forEach((v,i)=>{i===0?ctx.moveTo(xS(i),yS(v)):ctx.lineTo(xS(i),yS(v));});ctx.stroke();});}
function drawMACD(id,hist,dif){const c=document.getElementById(id);if(!c)return;const W=c.offsetWidth||640,H=90;c.width=W;c.height=H;const ctx=c.getContext('2d');const n=hist.length,P={t:8,b:8,l:8,r:50},cw=W-P.l-P.r,ch=H-P.t-P.b;const xS=i=>P.l+i*(cw/(n-1||1));const allV=[...hist,...dif].filter(v=>v!=null);const mn=Math.min(...allV),mx=Math.max(...allV),rng=mx-mn||0.001;const yS=v=>((mx-v)/rng)*ch+P.t,y0=yS(0);ctx.strokeStyle='#21262d';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(P.l,y0);ctx.lineTo(W-P.r,y0);ctx.stroke();const bw=Math.max(2,cw/n*0.6);hist.forEach((v,i)=>{const x=xS(i),yt=Math.min(yS(v),y0),h=Math.abs(yS(v)-y0);ctx.fillStyle=v>=0?'rgba(248,81,73,0.7)':'rgba(38,166,65,0.7)';ctx.fillRect(x-bw/2,yt,bw,Math.max(1,h));});ctx.strokeStyle='#58a6ff';ctx.lineWidth=1.5;ctx.beginPath();dif.forEach((v,i)=>{if(v==null)return;i===0?ctx.moveTo(xS(i),yS(v)):ctx.lineTo(xS(i),yS(v));});ctx.stroke();[mn,0,mx].forEach(v=>{ctx.fillStyle='#8b949e';ctx.font='9px Arial';ctx.textAlign='left';ctx.fillText(v.toFixed(2),W-P.r+4,yS(v)+3);});}

function updCP(){const s=STOCKS.find(x=>x.sym===calcSym),db=DB[calcSym];const b=document.getElementById('cBox');if(!b)return;b.textContent=db?`${s.name} 當日收盤：${db.last.c} ${s.cur}`:'此股票無資料';}
function cC1(){const db=DB[calcSym];if(!db)return;const p=db.last.c,amt=+document.getElementById('cInv').value||0;if(amt>0){const sh=Math.floor(amt/p);document.getElementById('cBuy').textContent=sh;document.getElementById('cReal').textContent=rnd(sh*p);document.getElementById('cLeft').textContent=rnd(amt-sh*p);}else{['cBuy','cReal','cLeft'].forEach(id=>document.getElementById(id).textContent='—');}}

// ── 三大法人歷史趨勢（FinMind，近N日）──
const INST_CACHE={};
async function fetchInstHist(stockId){
  if(INST_CACHE[stockId])return INST_CACHE[stockId];
  // 抓最近約20天（多抓一點，顯示10個交易日）
  const d=new Date();d.setDate(d.getDate()-25);
  const start=d.toISOString().slice(0,10);
  try{
    const res=await fetch(`${WORKER_URL}/?type=inst&id=${stockId}&start=${start}&_t=${Date.now()}`,{cache:'no-store'});
    const json=await res.json();
    INST_CACHE[stockId]=json;
    return json;
  }catch(e){return null;}
}
// FinMind法人類別：Foreign_Investor(外資)/Investment_Trust(投信)/Dealer系列(自營)
function aggInstByDate(rows){
  // 把同一天的各類別整理成 {date:{foreign,trust,dealer}}
  const byDate={};
  rows.forEach(r=>{
    const d=r.date;
    if(!byDate[d])byDate[d]={foreign:0,trust:0,dealer:0};
    const net=(r.buy-r.sell);
    const n=r.name||"";
    if(n.includes("Foreign"))byDate[d].foreign+=net;
    else if(n.includes("Investment_Trust"))byDate[d].trust+=net;
    else if(n.includes("Dealer"))byDate[d].dealer+=net;
  });
  return byDate;
}
let instCurId=null;
async function renderInst(){
  // 預設選第一支台股
  const twStocks=STOCKS.filter(s=>s.mkt==='TW'&&!s.sym.startsWith('^'));
  if(!instCurId)instCurId=twStocks[0].sym.replace(/\.TWO?$/,'');
  const opts=twStocks.map(s=>{const id=s.sym.replace(/\.TWO?$/,'');return `<option value="${id}"${id===instCurId?' selected':''}>${s.name} (${id})</option>`;}).join('');
  document.getElementById('mainView').innerHTML=`
  <div class="panel">
    <div style="font-size:15px;font-weight:700;color:#e3b341;margin-bottom:8px">🏦 三大法人買賣超趨勢（近10日，單位:張）</div>
    <div class="calc-row" style="margin-bottom:10px"><label style="width:70px">選擇台股</label>
      <select id="instSel" onchange="instCurId=this.value;renderInst()" style="flex:1;background:#21262d;border:1px solid #30363d;border-radius:5px;padding:7px 8px;color:#e6edf3;font-size:13px">${opts}</select></div>
    <div id="instTable"><div class="loading">🔄 載入法人資料中...</div></div>
  </div>`;
  const raw=await fetchInstHist(instCurId);
  const box=document.getElementById('instTable');
  if(!box)return;
  if(!raw||raw.status!==200||!raw.data||!raw.data.length){
    const msg=raw&&raw.msg?raw.msg:'無資料（可能非交易日、或當日FinMind尚未更新）';
    box.innerHTML=`<div class="loading">${msg}</div>`;
    return;
  }
  const byDate=aggInstByDate(raw.data);
  const dates=Object.keys(byDate).sort().reverse().slice(0,10); // 最新10天
  const lot=n=>Math.round(n/1000);
  const fmt=n=>{const v=lot(n);const cls=v>0?'up':v<0?'dn':'fl';return `<span class="${cls}">${v>0?'+':''}${v.toLocaleString()}</span>`;};
  // 計算外資連續買/賣
  let streak=0,streakDir=0;
  for(const d of dates){const f=byDate[d].foreign;const dir=f>0?1:f<0?-1:0;if(streak===0){streak=1;streakDir=dir;}else if(dir===streakDir&&dir!==0){streak++;}else break;}
  const streakTxt=streakDir>0?`外資連${streak}買`:streakDir<0?`外資連${streak}賣`:'—';
  const streakCls=streakDir>0?'up':streakDir<0?'dn':'fl';
  const rows=dates.map(d=>{const x=byDate[d];return `<tr>
    <td>${d.slice(5)}</td>
    <td>${fmt(x.foreign)}</td><td>${fmt(x.trust)}</td><td>${fmt(x.dealer)}</td>
    <td><b>${fmt(x.foreign+x.trust+x.dealer)}</b></td></tr>`;}).join('');
  box.innerHTML=`
    <div style="font-size:12px;margin-bottom:8px">近期趨勢：<span class="${streakCls}" style="font-weight:700">${streakTxt}</span></div>
    <table class="tbl" style="min-width:480px">
      <thead><tr><th>日期</th><th>外資</th><th>投信</th><th>自營商</th><th>合計</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="margin-top:10px;font-size:10px;color:#8b949e;line-height:1.7">
      <span class="up">紅=買超</span> <span class="dn">綠=賣超</span>。資料來源:FinMind(含上市櫃)。<br>
      💡 外資連續買超→國際資金看好;連續賣超→留意調節。投信買超常有作帳行情。
    </div>`;
}
