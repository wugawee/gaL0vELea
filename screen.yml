name: 收盤技術篩選

on:
  schedule:
    # 台北 18:17 / 18:43 / 19:19 / 20:07 / 21:31（週一～週五）；GitHub 用 UTC，台北 = UTC+8
    # 刻意避開整點與半點（GitHub 排程在那些分鐘最塞，曾延遲 4 小時）；多排幾個時段，資料沒變就不會產生 commit
    - cron: "17 10 * * 1-5"
    - cron: "43 10 * * 1-5"
    - cron: "19 11 * * 1-5"
    - cron: "7 12 * * 1-5"
    - cron: "31 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 抓資料並篩選
        run: node scripts/screen.js
      - name: 提交結果
        run: |
          git config user.name "screen-bot"
          git config user.email "screen-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "screen $(TZ=Asia/Taipei date +%F' '%H:%M)"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
